# Builds the multi-arch image ghcr.io/scc-digitalhub/tvm-runtime-go:<X.Y> (linux/amd64 and
# linux/arm64) when a tag tvm-X.Y or tvm-X.Y.Z is pushed: the Nuclio processor with the
# compiled-in tvm runtime (images/tvm). Each architecture builds natively with the TVM
# libraries of the same variant of ghcr.io/scc-digitalhub/tvm-toolkit:<X.Y> (which must
# be published, and public, first) and pushes <X.Y>-<arch>; the manifest job then
# publishes <X.Y>. Tags carry the tvm- prefix to stay clear of this repository's own
# versions: never publish a GitHub Release for them.
name: tvm-runtime-go image

on:
  push:
    tags:
      - "tvm-[0-9]+.[0-9]+"
      - "tvm-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/scc-digitalhub/tvm-runtime-go
  TOOLKIT_IMAGE: ghcr.io/scc-digitalhub/tvm-toolkit

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Resolve version from the tag
        id: v
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^tvm-([0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::run on a tag tvm-X.Y or tvm-X.Y.Z, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TOOLKIT: ghcr.io/scc-digitalhub/tvm-toolkit:${{ needs.version.outputs.tag }}
      REF: ghcr.io/scc-digitalhub/tvm-runtime-go:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Take TVM from tvm-toolkit
        run: |
          docker pull --platform "linux/${{ matrix.arch }}" "$TOOLKIT"
          arch="$(docker image inspect -f '{{.Architecture}}' "$TOOLKIT")"
          if [ "$arch" != "${{ matrix.arch }}" ]; then
            echo "::error::$TOOLKIT resolved to $arch, expected ${{ matrix.arch }} (is the toolkit multi-arch?)"
            exit 1
          fi
          label() { docker inspect -f "{{ index .Config.Labels \"$1\" }}" "$TOOLKIT"; }
          version="$(label org.opencontainers.image.version)"
          revision="$(label org.opencontainers.image.revision)"
          ffi_version="$(label org.digitalhub.tvm-ffi.version)"
          ffi_revision="$(label org.digitalhub.tvm-ffi.revision)"
          for value in "$version" "$revision" "$ffi_version" "$ffi_revision"; do
            if [ -z "$value" ] || [ "$value" = "<no value>" ]; then
              echo "::error::$TOOLKIT has no TVM version labels: rebuild it with the digitalhub-tvm-toolkit workflow"
              exit 1
            fi
          done
          tvm_build="$RUNNER_TEMP/tvm-build"
          mkdir -p "$tvm_build/lib"
          cid="$(docker create --platform "linux/${{ matrix.arch }}" "$TOOLKIT")"
          docker cp "$cid:/opt/tvm/lib/libtvm_runtime.so" "$tvm_build/lib/"
          docker cp "$cid:/opt/tvm/lib/libtvm_ffi.so" "$tvm_build/lib/"
          docker rm "$cid"
          # headers from the exact TVM / tvm-ffi commits the libraries were built from
          git clone --depth 1 --branch "v$version" https://github.com/apache/tvm "$RUNNER_TEMP/tvm"
          git -C "$RUNNER_TEMP/tvm" submodule update --init --depth 1 3rdparty/tvm-ffi
          git -C "$RUNNER_TEMP/tvm/3rdparty/tvm-ffi" submodule update --init --depth 1 3rdparty/dlpack
          if [ "$(git -C "$RUNNER_TEMP/tvm" rev-parse HEAD)" != "$revision" ] \
            || [ "$(git -C "$RUNNER_TEMP/tvm/3rdparty/tvm-ffi" rev-parse HEAD)" != "$ffi_revision" ]; then
            echo "::error::apache/tvm v$version does not match the commits $TOOLKIT was built from"
            exit 1
          fi
          {
            echo "TVM_VERSION=$version"
            echo "TVM_GIT_COMMIT=$revision"
            echo "TVM_FFI_VERSION=$ffi_version"
            echo "TVM_FFI_GIT_COMMIT=$ffi_revision"
            echo "TVM_SRC=$RUNNER_TEMP/tvm"
            echo "TVM_BUILD=$tvm_build"
          } >> "$GITHUB_ENV"

      - name: Stage the image build context
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ctx="$RUNNER_TEMP/ctx"
          ffi="$TVM_SRC/3rdparty/tvm-ffi"
          mkdir -p "$ctx/tvm-include/tvm-ffi" "$ctx/tvm-include/dlpack" "$ctx/tvm-lib"
          cp -r "$ffi/include/." "$ctx/tvm-include/tvm-ffi/"
          cp -r "$ffi/3rdparty/dlpack/include/." "$ctx/tvm-include/dlpack/"
          cp "$TVM_BUILD/lib/libtvm_ffi.so" "$TVM_BUILD/lib/libtvm_runtime.so" "$ctx/tvm-lib/"
          rsync -a --exclude .git --exclude test --exclude images "$GITHUB_WORKSPACE/" "$ctx/src/"
          cp images/tvm/Dockerfile images/tvm/entrypoint.sh "$ctx/"
          python3 - "$ctx" <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          ctx = Path(sys.argv[1])
          run_url = "{}/{}/actions/runs/{}".format(
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
          )
          manifest = {
              "schema_version": 1,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platform": "linux/" + os.environ["ARCH"],
              "tvm_version": os.environ["TVM_VERSION"],
              "tvm_git_commit": os.environ["TVM_GIT_COMMIT"],
              "tvm_ffi_version": os.environ["TVM_FFI_VERSION"],
              "tvm_ffi_git_commit": os.environ["TVM_FFI_GIT_COMMIT"],
              "libraries_from": os.environ["TOOLKIT"],
              "build_run": run_url,
              "libraries": {
                  lib.name: hashlib.sha256(lib.read_bytes()).hexdigest()
                  for lib in sorted((ctx / "tvm-lib").glob("*.so"))
              },
          }
          (ctx / "provenance.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
          echo "CTX=$ctx" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build -t "$REF" \
            --build-arg "TVM_VERSION=$TVM_VERSION" \
            --build-arg "TVM_GIT_COMMIT=$TVM_GIT_COMMIT" \
            --build-arg "TVM_FFI_VERSION=$TVM_FFI_VERSION" \
            --build-arg "TVM_FFI_GIT_COMMIT=$TVM_FFI_GIT_COMMIT" \
            "$CTX"
          arch="$(docker image inspect -f '{{.Architecture}}' "$REF")"
          if [ "$arch" != "${{ matrix.arch }}" ]; then
            echo "::error::built $arch instead of ${{ matrix.arch }}"
            exit 1
          fi
          for library in libtvm_runtime.so libtvm_ffi.so; do
            want="$(sha256sum "$CTX/tvm-lib/$library" | cut -d' ' -f1)"
            got="$(docker run --rm --entrypoint /usr/bin/sha256sum "$REF" "/opt/tvm/lib/$library" | cut -d' ' -f1)"
            if [ "$want" != "$got" ]; then
              echo "::error::$library in $REF differs from the one taken from tvm-toolkit"
              exit 1
            fi
          done

      - name: Push image
        run: docker push "$REF"

  manifest:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish the multi-arch tag
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$TAG" > index.json
          python3 - index.json <<'PY'
          import json
          import sys

          index = json.load(open(sys.argv[1]))
          platforms = sorted(
              "{}/{}".format(m["platform"]["os"], m["platform"]["architecture"])
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("os") != "unknown"
          )
          print("platforms:", platforms)
          sys.exit(0 if platforms == ["linux/amd64", "linux/arm64"] else 1)
          PY
          {
            echo "### Published \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)"
            echo "TVM libraries from \`$TOOLKIT_IMAGE:$TAG\`"
            echo ""
            echo "On the first publish make the package public: organization → Packages → tvm-runtime-go → Package settings."
          } >> "$GITHUB_STEP_SUMMARY"
